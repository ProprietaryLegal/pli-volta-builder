# window.conf: everything machine-specific the window driver needs (scripts/window_driver.sh). Keep the filled copy
# in the build's PRIVATE tree: it names hosts, paths and card selections. PORT is set by the driver for each command.
LOG_DIR=/path/to/build/logs/window          # one folder per window TAG; phases.log has one line per phase
ARMS_DIR=/path/to/build/window/arms         # <ARM>.env, <ARM>.bootchecks, <ARM>.lines
TEST_PORT=8001                              # arms boot here
SERVE_PORT=8000                             # users; booted only by servedefault on a matching record
XID_COUNT_CMD="journalctl -k --no-pager | grep -c 'NVRM: Xid' || true"
START_ARM_CMD="bash /path/to/build/run/serve.sh --port \$PORT"     # must start in the background-safe way your engine needs
STOP_ARM_CMD="bash /path/to/build/run/stop.sh --port \$PORT"
START_SERVING_CMD="bash /path/to/build/run/serve.sh --port \$PORT --profile serving"
STOP_SERVING_CMD="bash /path/to/build/run/stop.sh --port 8000"
HEALTH_CMD="curl -sf http://127.0.0.1:\$PORT/health"
CARDS_EMPTY_CMD="test \$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | awk '\$1>500' | wc -l) -eq 0"
BOOT_TIMEOUT_S=600                          # from real boots plus a margin; a timeout is a failure, never raised
SERVE_CONFIG_JSON=/path/to/build/run/serving-config.json   # see scripts/serving_record.py
SERVE_RECORD=/path/to/build/run/state/SERVE-CHECKED.json
